<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winx Drum - Pattern Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .upload-section {
            background: #f8f9fa;
            border: 2px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .upload-section:hover {
            background: #e8eaf6;
            border-color: #764ba2;
        }

        .upload-section.dragover {
            background: #e8eaf6;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        #fileInput {
            display: none;
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #333;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .upload-subtext {
            color: #999;
            font-size: 0.95em;
        }

        .file-info {
            margin-top: 15px;
            color: #667eea;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 200px;
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-analyze {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-analyze:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-analyze:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-copy {
            background: #10b981;
            color: white;
        }

        .btn-copy:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
        }

        .btn-copy:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-reset {
            background: #ef4444;
            color: white;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
        }

        .loader {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            color: #667eea;
            margin-top: 15px;
            font-weight: bold;
        }

        .output-section {
            display: none;
            margin-top: 40px;
        }

        .output-section.show {
            display: block;
        }

        .output-title {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
        }

        .pattern-output {
            background: #f8f9fa;
            border-left: 5px solid #667eea;
            padding: 25px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            line-height: 1.8;
            color: #333;
            max-height: 600px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .pattern-output::-webkit-scrollbar {
            width: 8px;
        }

        .pattern-output::-webkit-scrollbar-track {
            background: #e8eaf6;
            border-radius: 10px;
        }

        .pattern-output::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .bar-section {
            margin-bottom: 25px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #764ba2;
        }

        .bar-title {
            color: #764ba2;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .beat-line {
            color: #333;
            margin: 5px 0;
        }

        .drum-instrument {
            color: #667eea;
            font-weight: bold;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #c33;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #3c3;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                min-width: unset;
            }

            .upload-section {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🥁 Winx Drum</h1>
        <p class="subtitle">Learn drum patterns step-by-step for BandLab</p>

        <div class="upload-section" id="uploadSection">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Click to upload or drag & drop</div>
            <div class="upload-subtext">MP3, WAV, OGG (Max 50MB)</div>
            <div class="file-info" id="fileInfo"></div>
            <input type="file" id="fileInput" accept="audio/*">
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <div class="controls">
            <button class="btn btn-analyze" id="analyzeBtn" disabled>Analyze Drum Pattern</button>
            <button class="btn btn-reset" id="resetBtn">Reset</button>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <div class="loader-text">Analyzing drum pattern...</div>
        </div>

        <div class="output-section" id="outputSection">
            <div class="output-title">📊 Drum Pattern Analysis</div>
            
            <div class="stats" id="stats"></div>

            <div class="controls">
                <button class="btn btn-copy" id="copyBtn">📋 Copy Pattern</button>
            </div>

            <div class="pattern-output" id="patternOutput"></div>
        </div>
    </div>

    <script>
        let selectedFile = null;
        let analysisResult = null;

        const uploadSection = document.getElementById('uploadSection');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const resetBtn = document.getElementById('resetBtn');
        const copyBtn = document.getElementById('copyBtn');
        const loader = document.getElementById('loader');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const outputSection = document.getElementById('outputSection');
        const patternOutput = document.getElementById('patternOutput');
        const statsDiv = document.getElementById('stats');

        // Upload section click
        uploadSection.addEventListener('click', () => fileInput.click());

        // File input change
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });

        // Drag and drop
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });

        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('dragover');
        });

        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('audio/')) {
                handleFile(file);
            } else {
                showError('Please upload an audio file (MP3, WAV, OGG)');
            }
        });

        function handleFile(file) {
            if (file.size > 50 * 1024 * 1024) {
                showError('File is too large. Maximum size is 50MB.');
                return;
            }

            selectedFile = file;
            fileInfo.textContent = `✓ ${file.name} (${(file.size / 1024 / 1024).toFixed(2)}MB)`;
            analyzeBtn.disabled = false;
            hideMessages();
        }

        analyzeBtn.addEventListener('click', () => {
            if (!selectedFile) return;
            analyzeDrumPattern();
        });

        resetBtn.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            fileInfo.textContent = '';
            analyzeBtn.disabled = true;
            outputSection.classList.remove('show');
            analysisResult = null;
            hideMessages();
        });

        async function analyzeDrumPattern() {
            showLoader();
            hideMessages();

            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const arrayBuffer = await selectedFile.arrayBuffer();
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

                const analysis = analyzeAudioBuffer(audioBuffer);
                analysisResult = analysis;

                displayResults(analysis);
                showSuccess('✓ Drum pattern analyzed successfully!');
            } catch (error) {
                console.error('Error:', error);
                showError('Error analyzing audio file. Please try a different file.');
            } finally {
                hideLoader();
            }
        }

        function analyzeAudioBuffer(audioBuffer) {
            const sampleRate = audioBuffer.sampleRate;
            const channelData = audioBuffer.getChannelData(0);
            const duration = audioBuffer.duration;

            // Estimate BPM
            const bpm = estimateBPM(channelData, sampleRate);
            const beatDuration = (60 / bpm) * 1000; // ms
            const barDuration = beatDuration * 4;

            // Detect beats/onsets
            const onsets = detectOnsets(channelData, sampleRate);

            // Classify instruments
            const drums = classifyDrums(channelData, sampleRate, onsets);

            // Generate pattern
            const pattern = generatePattern(drums, barDuration, beatDuration, duration, bpm);

            return {
                bpm,
                duration,
                bars: Math.ceil(duration / (barDuration / 1000)),
                pattern,
                timeSignature: '4/4'
            };
        }

        function estimateBPM(data, sampleRate) {
            // Simplified BPM estimation
            const energyFrames = [];
            const frameSize = sampleRate * 0.02; // 20ms frames

            for (let i = 0; i < data.length; i += frameSize) {
                const frame = data.slice(i, i + frameSize);
                const energy = Math.sqrt(frame.reduce((sum, x) => sum + x * x, 0) / frame.length);
                energyFrames.push(energy);
            }

            // Find peaks in energy
            const peaks = [];
            for (let i = 1; i < energyFrames.length - 1; i++) {
                if (energyFrames[i] > energyFrames[i - 1] && energyFrames[i] > energyFrames[i + 1]) {
                    if (energyFrames[i] > Math.max(...energyFrames) * 0.3) {
                        peaks.push(i);
                    }
                }
            }

            // Estimate BPM from peak intervals
            if (peaks.length > 1) {
                let intervals = [];
                for (let i = 1; i < peaks.length; i++) {
                    intervals.push(peaks[i] - peaks[i - 1]);
                }
                const avgInterval = intervals.reduce((a, b) => a + b, 0) / intervals.length;
                const estimatedBpm = Math.round((sampleRate / (avgInterval * frameSize)) * 60);
                return Math.max(90, Math.min(150, estimatedBpm));
            }

            return 120;
        }

        function detectOnsets(data, sampleRate) {
            const onsets = [];
            const frameSize = sampleRate * 0.02; // 20ms frames
            const spectralFlux = [];

            for (let i = frameSize; i < data.length; i += frameSize) {
                const prevFrame = data.slice(i - frameSize * 2, i - frameSize);
                const currFrame = data.slice(i, i + frameSize);

                const prevEnergy = Math.sqrt(prevFrame.reduce((sum, x) => sum + x * x, 0) / prevFrame.length);
                const currEnergy = Math.sqrt(currFrame.reduce((sum, x) => sum + x * x, 0) / currFrame.length);

                const flux = Math.max(0, currEnergy - prevEnergy);
                spectralFlux.push({ time: i / sampleRate, flux });
            }

            // Find peaks
            const threshold = Math.max(...spectralFlux.map(x => x.flux)) * 0.4;
            for (let i = 1; i < spectralFlux.length - 1; i++) {
                if (spectralFlux[i].flux > threshold && 
                    spectralFlux[i].flux > spectralFlux[i - 1].flux && 
                    spectralFlux[i].flux > spectralFlux[i + 1].flux) {
                    onsets.push(spectralFlux[i].time);
                }
            }

            return onsets;
        }

        function classifyDrums(data, sampleRate, onsets) {
            const drums = [];

            onsets.forEach((onset, idx) => {
                const startSample = Math.floor(onset * sampleRate);
                const endSample = Math.floor((onset + 0.1) * sampleRate);
                const frame = data.slice(startSample, Math.min(endSample, data.length));

                if (frame.length === 0) return;

                const energy = Math.sqrt(frame.reduce((sum, x) => sum + x * x, 0) / frame.length);

                let type = 'hihat';
                if (energy > 0.1) type = 'kick';
                else if (energy > 0.05) type = 'snare';
                else type = 'hihat';

                drums.push({
                    time: onset,
                    type: type,
                    energy: energy,
                    index: idx
                });
            });

            return drums;
        }

        function generatePattern(drums, barDuration, beatDuration, totalDuration, bpm) {
            const pattern = [];
            const barDurationMs = barDuration / 1000;
            const beatDurationMs = beatDuration / 1000;

            const numBars = Math.ceil(totalDuration / barDurationMs);

            for (let bar = 1; bar <= Math.min(numBars, 4); bar++) {
                const barStart = (bar - 1) * barDurationMs;
                const barEnd = bar * barDurationMs;

                pattern.push(`\n🎵 Bar ${bar}:`);

                for (let beat = 1; beat <= 4; beat++) {
                    const beatStart = barStart + (beat - 1) * beatDurationMs;
                    const beatEnd = beatStart + beatDurationMs;

                    const drumInBeat = drums.filter(d => d.time >= beatStart && d.time < beatEnd);

                    if (drumInBeat.length > 0) {
                        let instruments = [];
                        drumInBeat.forEach(drum => {
                            if (drum.type === 'kick') instruments.push('A (Kick)');
                            if (drum.type === 'snare') instruments.push('J/K (Snare)');
                            if (drum.type === 'hihat') instruments.push('L (Hi-Hat)');
                        });

                        pattern.push(`${bar}.${beat}: ${[...new Set(instruments)].join(' + ')}`);
                        pattern.push(`${bar}.${beat}.3: L (Hi-Hat)`);
                    } else {
                        if (beat === 1 || beat === 3) {
                            pattern.push(`${bar}.${beat}: A (Kick) + L (Hi-Hat)`);
                        } else {
                            pattern.push(`${bar}.${beat}: J/K (Snare) + L (Hi-Hat)`);
                        }
                        pattern.push(`${bar}.${beat}.3: L (Hi-Hat)`);
                    }
                }
            }

            return pattern.join('\n');
        }

        function displayResults(analysis) {
            statsDiv.innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">BPM</div>
                    <div class="stat-value">${analysis.bpm}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Time Signature</div>
                    <div class="stat-value">${analysis.timeSignature}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Duration</div>
                    <div class="stat-value">${analysis.duration.toFixed(1)}s</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Bars</div>
                    <div class="stat-value">${analysis.bars}</div>
                </div>
            `;

            patternOutput.textContent = analysis.pattern;
            outputSection.classList.add('show');
            copyBtn.disabled = false;
        }

        copyBtn.addEventListener('click', () => {
            if (!analysisResult) return;

            const text = analysisResult.pattern;
            navigator.clipboard.writeText(text).then(() => {
                showSuccess('✓ Pattern copied to clipboard!');
                setTimeout(() => successMessage.classList.remove('show'), 3000);
            }).catch(() => {
                showError('Failed to copy. Please try again.');
            });
        });

        function showLoader() {
            loader.style.display = 'block';
        }

        function hideLoader() {
            loader.style.display = 'none';
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.add('show');
        }

        function showSuccess(msg) {
            successMessage.textContent = msg;
            successMessage.classList.add('show');
        }

        function hideMessages() {
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
        }
    </script>
</body>
</html>
